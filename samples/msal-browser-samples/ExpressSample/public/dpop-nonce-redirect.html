<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DPoP Nonce Redirect Handoff</title>
    </head>
    <body>
        <p>
            Processing the DPoP redirect response and returning to the
            playground...
        </p>
        <pre id="status"></pre>

        <script src="/lib/msal-browser/msal-browser.js"></script>
        <script>
            const pendingKey = "msal.dpopNoncePlayground.pendingRedirect";
            const pendingTtlMs = 10 * 60 * 1000;
            const diagnosticKey = "msal.dpopNoncePlayground.diagnostics";
            const handoffSuffix = ".dpop.nonce.redirect";
            const status = document.getElementById("status");

            function getHandoffSnapshot() {
                const entries = [];
                for (
                    let index = 0;
                    index < window.sessionStorage.length;
                    index++
                ) {
                    const key = window.sessionStorage.key(index);
                    if (!key || !key.endsWith(handoffSuffix)) {
                        continue;
                    }
                    const serialized = window.sessionStorage.getItem(key);
                    let parsed = null;
                    try {
                        parsed = serialized ? JSON.parse(serialized) : null;
                    } catch {
                        parsed = null;
                    }
                    entries.push({
                        key,
                        resourceServer: parsed && parsed.resourceServer,
                        expiresAt: parsed && parsed.expiresAt,
                        nonceLength:
                            parsed && typeof parsed.nonce === "string"
                                ? new TextEncoder().encode(parsed.nonce).length
                                : null,
                        stateBound: Boolean(
                            parsed && typeof parsed.state === "string"
                        ),
                        correlationIdBound: Boolean(
                            parsed && typeof parsed.correlationId === "string"
                        ),
                    });
                }
                return entries;
            }

            function appendDiagnostic(type, details) {
                let diagnostics = [];
                try {
                    diagnostics = JSON.parse(
                        window.sessionStorage.getItem(diagnosticKey) || "[]"
                    );
                } catch {
                    diagnostics = [];
                }
                diagnostics.push({
                    timestamp: new Date().toISOString(),
                    type,
                    ...details,
                });
                window.sessionStorage.setItem(
                    diagnosticKey,
                    JSON.stringify(diagnostics.slice(-100))
                );
                status.textContent = JSON.stringify(
                    diagnostics[diagnostics.length - 1],
                    null,
                    2
                );
            }

            async function processRedirect() {
                const serialized = window.sessionStorage.getItem(pendingKey);
                if (!serialized) {
                    throw new Error(
                        "No pending DPoP playground redirect configuration was found."
                    );
                }

                const pending = JSON.parse(serialized);
                if (
                    typeof pending.createdAt !== "number" ||
                    Date.now() - pending.createdAt > pendingTtlMs
                ) {
                    window.sessionStorage.removeItem(pendingKey);
                    throw new Error(
                        "The pending DPoP playground redirect configuration expired."
                    );
                }
                appendDiagnostic("redirect-intermediate-page-loaded", {
                    handoff: getHandoffSnapshot(),
                });

                const instance = new msal.PublicClientApplication(
                    pending.config
                );
                await instance.initialize();
                instance.addPerformanceCallback((events) => {
                    events.forEach((event) => {
                        const ext = event.ext || {};
                        const failures = Object.fromEntries(
                            Object.entries(ext).filter(([key]) =>
                                key.startsWith("dpopNonceRedirectHandoff")
                            )
                        );
                        if (Object.keys(failures).length > 0) {
                            appendDiagnostic("handoff-storage-telemetry", {
                                event: event.name,
                                failures,
                            });
                        }
                    });
                });

                await instance.handleRedirectPromise();
                appendDiagnostic("redirect-intermediate-page-completed", {
                    handoff: getHandoffSnapshot(),
                });
            }

            processRedirect().catch((error) => {
                appendDiagnostic("redirect-intermediate-page-error", {
                    error: error.message,
                    handoff: getHandoffSnapshot(),
                });
            });
        </script>
    </body>
</html>
