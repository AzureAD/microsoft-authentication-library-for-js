<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Embedded App (Trusted)</title>
        <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
            integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
            crossorigin="anonymous"
        />
        <style>
            body {
                padding: 15px;
                font-size: 0.9em;
            }
            .status-badge {
                font-size: 0.85em;
            }
        </style>
    </head>
    <body>
        <div id="not-authenticated">
            <p id="status-text">Not signed in.</p>
            <button type="button" class="btn btn-primary btn-sm" id="signIn">
                Sign In (Broker)
            </button>
        </div>

        <div id="authenticated" style="display: none">
            <p>
                Signed in as:
                <strong id="username-display"></strong>
                <span class="badge badge-success status-badge" id="auth-status"
                    >Authenticated</span
                >
            </p>
            <div class="mb-2">
                <button
                    type="button"
                    class="btn btn-outline-primary btn-sm"
                    id="acquireTokenSilent"
                >
                    Acquire Token (Silent)
                </button>
                <button
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    id="signOut"
                >
                    Sign Out
                </button>
            </div>
            <div id="token-info" class="card" style="display: none">
                <div class="card-body">
                    <h6 class="card-title">Token Response</h6>
                    <pre
                        id="token-response"
                        class="mb-0"
                        style="
                            max-height: 150px;
                            overflow: auto;
                            font-size: 0.8em;
                        "
                    ></pre>
                </div>
            </div>
        </div>

        <script type="module" src="./embedded.js"></script>
    </body>
</html>
