parameters:
    - name: "debug"
      displayName: "Debug Variables"
      type: boolean
      default: false
    - name: "poolType"
      displayName: "Pool Type"
      type: string
      default: "windows"
      values:
        - "windows"
        - "linux"
    - name: "npmInstallTimeout"
      displayName: "NPM Install Timeout (Tests)"
      type: number
      default: 15
    - name: "enableScreenshots"
      displayName: "Enable E2E Screenshots"
      type: boolean
      default: false
variables:
    CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
    LinuxContainerImage: "mcr.microsoft.com/onebranch/cbl-mariner/build:2.0" # Docker image which is used to build the project https://aka.ms/obpipelines/containers
    DEBIAN_FRONTEND: noninteractive
    sourceBranch: $[coalesce(replace(variables['System.PullRequest.SourceBranch'], 'refs/heads/', ''), replace(variables['Build.SourceBranch'], 'refs/heads/', ''))]
    sourceRepo: "microsoft-authentication-library-for-js"

resources:
    repositories:
        - repository: templates
          type: git
          name: OneBranch.Pipelines/GovernedTemplates
          ref: refs/heads/main
        - repository: 1P
          type: git
          name: IDDP/msal-javascript-1p
          ref: dev

extends:
    template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
    parameters:
        globalSdl:
            policheck:
                break: true
        stages:
            - stage: e2e_test
              displayName: "E2E Tests"
              variables:
                  Codeql.Enabled: true
              jobs:
                  - job: detect_changes
                    displayName: "Detect changed packages"
                    pool:
                      type: linux
                      isCustom: true
                      name: "Azure Pipelines"
                      vmImage: "ubuntu-latest"
                    steps:
                      - checkout: self
                        path: 3p
                        fetchDepth: 0
                        persistCredentials: true
                      - checkout: 1P
                        path: 1p
                        fetchDepth: 0
                        persistCredentials: true
                      - task: PowerShell@2
                        name: detect
                        displayName: "Compute affected libraries"
                        inputs:
                          targetType: filePath
                          filePath: $(Pipeline.Workspace)/3p/.pipelines/scripts/detect-changes.ps1
                          arguments: -Repo3pPath "$(Pipeline.Workspace)/3p" -Repo1pPath "$(Pipeline.Workspace)/1p"
                          pwsh: true

                  - template: .pipelines/templates/e2e-tests.yml@1P
                    parameters:
                        jobName: "msal_browser_1p_3p_e2e_tests"
                        targetLib: "msal-browser-1p"
                        poolType: ${{ parameters.poolType }}
                        stage: "CI"
                        sourceRepo: ${{ variables.sourceRepo }}
                        sourceBranch: ${{ variables.sourceBranch }}
                        workspace: "samples/"
                        samples:
                            - name: "Broker_WAMTestApp"
                            - name: "PerformanceTelemetrySample"
                            - name: "BrokerTestApp-React"
                            - name: "BrokerSingleFrameTestApp"
                        debug: ${{ parameters.debug }}
                        npmInstallTimeout: ${{ parameters.npmInstallTimeout }}
                        dependsOn: [detect_changes]
                        jobCondition: "eq(dependencies.detect_changes.outputs['detect.runMsalBrowser1p'], 'true')"
                        enableScreenshots: ${{ parameters.enableScreenshots }}
