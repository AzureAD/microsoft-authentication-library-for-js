parameters:
    - name: "debug"
      displayName: "Debug Variables"
      type: boolean
      default: false
    - name: "poolType"
      displayName: "Pool Type"
      type: string
      default: "windows"
      values:
        - "windows"
        - "linux"
    - name: "npmInstallTimeout"
      displayName: "NPM Install Timeout (Tests)"
      type: number
      default: 15
    - name: "enableScreenshots"
      displayName: "Enable E2E Screenshots"
      type: boolean
      default: false
variables:
    CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
    LinuxContainerImage: "mcr.microsoft.com/onebranch/cbl-mariner/build:2.0" # Docker image which is used to build the project https://aka.ms/obpipelines/containers
    DEBIAN_FRONTEND: noninteractive
    sourceBranch: $[coalesce(replace(variables['System.PullRequest.SourceBranch'], 'refs/heads/', ''), replace(variables['Build.SourceBranch'], 'refs/heads/', ''))]
    sourceRepo: "microsoft-authentication-library-for-js"

resources:
    repositories:
        - repository: templates
          type: git
          name: OneBranch.Pipelines/GovernedTemplates
          ref: refs/heads/main
        - repository: 1P
          type: git
          name: IDDP/msal-javascript-1p
          ref: dev

extends:
    template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
    parameters:
        globalSdl:
            policheck:
                break: true
        stages:
            - stage: e2e_test
              displayName: "E2E Tests"
              variables:
                  Codeql.Enabled: true
              jobs:
                  - job: detect_changes
                    displayName: "Detect changed packages"
                    pool:
                      type: linux
                      isCustom: true
                      name: "Azure Pipelines"
                      vmImage: "ubuntu-latest"
                    steps:
                      - checkout: self
                        fetchDepth: 0
                        persistCredentials: true
                      - checkout: 1P
                        fetchDepth: 0
                        persistCredentials: true
                      - task: PowerShell@2
                        name: detect
                        displayName: "Compute affected libraries"
                        inputs:
                          targetType: inline
                          pwsh: true
                          script: |
                            # Default: run everything (non-PR builds and manual runs)
                            $run1p = $true

                            if ($env:SYSTEM_PULLREQUEST_TARGETBRANCH) {
                                $target = $env:SYSTEM_PULLREQUEST_TARGETBRANCH -replace '^refs/heads/', ''
                                Write-Host "PR build: diffing against origin/$target"

                                # Check 3P repo for msal-common and msal-browser changes
                                Set-Location "$(Build.SourcesDirectory)/microsoft-authentication-library-for-js"
                                git fetch origin $target
                                if ($LASTEXITCODE -ne 0) { throw "git fetch failed in 3P repo" }
                                $changed3p = git diff --name-only "origin/$target...HEAD"

                                # Check 1P repo for msal-browser-1p changes
                                Set-Location "$(Build.SourcesDirectory)/msal-javascript-1p"
                                git fetch origin $target 2>$null  # branch may not exist in 1P repo; non-fatal
                                $changed1p = if ($LASTEXITCODE -eq 0) {
                                    git diff --name-only "origin/$target...HEAD"
                                } else { @() }

                                $changedCommon  = ($changed3p | Where-Object { $_ -match '^lib/msal-common/' }).Count -gt 0
                                $changedBrowser = ($changed3p | Where-Object { $_ -match '^lib/msal-browser/' -or $_ -match '^samples/msal-browser-samples/' }).Count -gt 0
                                $changed1pPkg   = ($changed1p  | Where-Object { $_ -match '^msal-browser-1p/' -or $_ -match '^samples/' }).Count -gt 0

                                $run1p = $changedCommon -or $changedBrowser -or $changed1pPkg

                                Write-Host "Changed: common=$changedCommon browser=$changedBrowser 1p=$changed1pPkg"
                            } else {
                                Write-Host "Non-PR build — running all test suites"
                            }

                            Write-Host "Run: browser-1p=$run1p"
                            Write-Host "##vso[task.setvariable variable=runMsalBrowser1p;isOutput=true]$($run1p.ToString().ToLower())"

                  - template: .pipelines/templates/e2e-tests.yml@1P
                    parameters:
                        jobName: "msal_browser_1p_3p_e2e_tests"
                        targetLib: "msal-browser-1p"
                        poolType: ${{ parameters.poolType }}
                        stage: "CI"
                        sourceRepo: ${{ variables.sourceRepo }}
                        sourceBranch: ${{ variables.sourceBranch }}
                        workspace: "samples/"
                        samples:
                            - name: "Broker_WAMTestApp"
                            - name: "PerformanceTelemetrySample"
                            - name: "BrokerTestApp-React"
                            - name: "BrokerSingleFrameTestApp"
                        debug: ${{ parameters.debug }}
                        npmInstallTimeout: ${{ parameters.npmInstallTimeout }}
                        dependsOn: [detect_changes]
                        jobCondition: "eq(dependencies.detect_changes.outputs['detect.runMsalBrowser1p'], 'true')"
                        enableScreenshots: ${{ parameters.enableScreenshots }}
