variables:
    CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
    WindowsContainerImage: "onebranch.azurecr.io/windows/ltsc2022/vse2022:latest" # Docker image which is used to build the project https://aka.ms/obpipelines/containers
    DEBIAN_FRONTEND: noninteractive

resources:
    repositories:
        - repository: templates
          type: git
          name: OneBranch.Pipelines/GovernedTemplates
          ref: refs/heads/main

extends:
    template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
    parameters:
        globalSdl:
            policheck:
                break: true
        featureFlags:
            WindowsHostVersion:
                Version: 2022
        stages:
            - stage: e2e_test
              displayName: "E2E Tests"
              jobs:
                  - job: browser_e2e_not_applicable
                    displayName: "Browser E2E not applicable"
                    pool:
                        type: windows
                    variables:
                        ob_outputDirectory: "./out"
                    steps:
                        - script: echo "Browser E2E validation is not applicable to the Node-only standalone-repository prototype; this job preserves the current monorepo required status context."
                          displayName: "Report browser E2E not applicable"
