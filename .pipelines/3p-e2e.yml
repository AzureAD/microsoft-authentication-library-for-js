parameters:
    - name: "debug"
      displayName: "Debug Variables"
      type: boolean
      default: false
    - name: "poolType"
      displayName: "Pool Type"
      type: string
      default: "windows"
      values:
        - "windows"
        - "linux"
    - name: "runBrowserTests"
      displayName: "Run Browser Tests"
      type: boolean
      default: true
    - name: "runNodeTests"
      displayName: "Run Node Tests"
      type: boolean
      default: true
    - name: "runReactTests"
      displayName: "Run React Tests"
      type: boolean
      default: true
    - name: "runAngularTests"
      displayName: "Run Angular Tests"
      type: boolean
      default: true
    - name: "npmInstallTimeout"
      displayName: "NPM Install Timeout (Tests)"
      type: number
      default: 15
    - name: "enableScreenshots"
      displayName: "Enable E2E Screenshots"
      type: boolean
      default: false

variables:
    CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
    LinuxContainerImage: "mcr.microsoft.com/onebranch/cbl-mariner/build:2.0" # Docker image which is used to build the project https://aka.ms/obpipelines/containers
    DEBIAN_FRONTEND: noninteractive
    sourceBranch: $[coalesce(replace(variables['System.PullRequest.SourceBranch'], 'refs/heads/', ''), replace(variables['Build.SourceBranch'], 'refs/heads/', ''))]
    sourceRepo: "microsoft-authentication-library-for-js"

resources:
    repositories:
        - repository: templates
          type: git
          name: OneBranch.Pipelines/GovernedTemplates
          ref: refs/heads/main
        - repository: 1P
          type: git
          name: IDDP/msal-javascript-1p
          ref: dev
extends:
    template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
    parameters:
        globalSdl:
            policheck:
                break: true

        stages:
            - stage: e2e_test
              displayName: "3P E2E Tests"
              jobs:
                - ${{ if eq(parameters.runBrowserTests, true) }}:
                  - template: .pipelines/templates/e2e-tests.yml@1P
                    parameters:
                        jobName: "validate_msal_browser"
                        targetLib: "msal-browser"
                        poolType: ${{ parameters.poolType }}
                        stage: "CI"
                        sourceRepo: ${{ variables.sourceRepo }}
                        sourceBranch: ${{ variables.sourceBranch }}
                        workspace: "samples/msal-browser-samples"
                        samples:
                            - name: "client-capabilities"
                            - name: "onPageLoad"
                            - name: "pop"
                            - name: "customizable-e2e-test-1"
                              dir: "customizable-e2e-test"
                              testFilter: "browserAAD\\.spec|localStorage|browserMem"
                            - name: "customizable-e2e-test-2"
                              dir: "customizable-e2e-test"
                              testFilter: "browserAADTenanted|browserAADMultiTenant"
                            - name: "customizable-e2e-test-3"
                              dir: "customizable-e2e-test"
                              testFilter: "browserB2C|browserMCP"
                            - name: "ExpressSample"
                        debug: ${{ parameters.debug }}
                        npmInstallTimeout: ${{ parameters.npmInstallTimeout }}
                        enableScreenshots: ${{ parameters.enableScreenshots }}
                - ${{ if eq(parameters.runNodeTests, true) }}:
                  - template: .pipelines/templates/e2e-tests.yml@1P
                    parameters:
                        jobName: "validate_msal_node"
                        targetLib: "msal-node"
                        poolType: ${{ parameters.poolType }}
                        stage: "CI"
                        sourceRepo: ${{ variables.sourceRepo }}
                        sourceBranch: ${{ variables.sourceBranch }}
                        workspace: "samples/msal-node-samples"
                        nodeVersions: ["20", "22", "24"]
                        samples:
                            - name: "auth-code-1"
                              dir: "auth-code"
                              testFilter: "auth-code-aad|auth-code-adfs"
                            - name: "auth-code-2"
                              dir: "auth-code"
                              testFilter: "auth-code-b2c"
                            - name: "auth-code-cli-app"
                            - name: "client-credentials"
                            - name: "client-credentials-with-cert-from-key-vault"
                            - name: "device-code"
                            - name: "silent-flow-1"
                              dir: "silent-flow"
                              testFilter: "silent-flow-aad|silent-flow-adfs"
                            - name: "silent-flow-2"
                              dir: "silent-flow"
                              testFilter: "silent-flow-b2c"
                            - name: "b2c-user-flows"
                            # - name: "on-behalf-of"
                        debug: ${{ parameters.debug }}
                        npmInstallTimeout: ${{ parameters.npmInstallTimeout }}
                        enableScreenshots: ${{ parameters.enableScreenshots }}
                - ${{ if eq(parameters.runReactTests, true) }}:
                  - template: .pipelines/templates/e2e-tests.yml@1P
                    parameters:
                        jobName: "validate_msal_react"
                        targetLib: "msal-react"
                        poolType: ${{ parameters.poolType }}
                        stage: "CI"
                        sourceRepo: ${{ variables.sourceRepo }}
                        sourceBranch: ${{ variables.sourceBranch }}
                        workspace: "samples/msal-react-samples"
                        samples:
                            - name: "nextjs-sample"
                            - name: "react-router-sample"
                            - name: "typescript-sample"
                            - name: "b2c-sample"
                            - name: "react16-sample"
                            - name: "react17-sample"
                            - name: "react18-sample"
                        debug: ${{ parameters.debug }}
                        npmInstallTimeout: ${{ parameters.npmInstallTimeout }}
                        enableScreenshots: ${{ parameters.enableScreenshots }}
                - ${{ if eq(parameters.runAngularTests, true) }}:
                  - template: .pipelines/templates/e2e-tests.yml@1P
                    parameters:
                        jobName: "validate_msal_angular"
                        targetLib: "msal-angular"
                        poolType: ${{ parameters.poolType }}
                        stage: "CI"
                        sourceRepo: ${{ variables.sourceRepo }}
                        sourceBranch: ${{ variables.sourceBranch }}
                        workspace: "samples/msal-angular-samples"
                        samples:
                            - name: "angular-b2c-sample"
                            - name: "angular-modules-sample"
                            - name: "angular-standalone-sample"
                        debug: ${{ parameters.debug }}
                        npmInstallTimeout: ${{ parameters.npmInstallTimeout }}
                        enableScreenshots: ${{ parameters.enableScreenshots }}